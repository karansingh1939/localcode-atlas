[project]
name = "localcode-atlas-backend"
version = "0.2.0"
license = "MIT"
description = "Offline semantic codebase search using SQLite, NumPy, and Ollama"
maintainers = [{name = "Karan Singh"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.4",
    "ollama>=0.5.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "watchdog>=4.0.0",
    "rich>=13.7.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "pathspec>=1.1.1,<2"
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/karansingh-1939/localcode-atlas"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Third-party notice from fastapi.testclient; not actionable in this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
